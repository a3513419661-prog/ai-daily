<style>

": "c0ce3898519a2a2c"}, {"title": "Seedance 2.5 Storyboard Workflow: Turning a Concept into a Shot-by-Shot Plan", "url": "https://grace-001.medium.com/seedance-2-5-storyboard-workflow-turning-a-concept-into-a-shot-by-shot-plan-e3e7176cc3da?source=rss------storyboard-5", "why": "Seedance 2.5 的分镜工作流：从一个概念拆到逐镜计划，适合当作可复制的项目模板。", "id": "6f5f39903e351a2c"}, {"title": "角色设定图提示词合集分享！码住随时用。", "url": "https://www.woshipm.com/ai/6482980.html", "why": "角色设定图提示词合集，中文可直接抄改，解决人物一致性里最费时间的第一步。", "id": "8041bf5055fab056"}, {"title": "Why AI Gets Japanese Patterns Wrong — and the Prompts That Fix Them", "url": "https://medium.com/@ai.art.wakitaitai/why-ai-gets-japanese-patterns-wrong-and-the-prompts-that-fix-them-fcea59b633ad?source=rss------ai_art-5", "why": "拆解 AI 画不对日式纹样的原因并给出修正提示词，是「发现问题→改提示词」的通用方法论示范。", "id": "603750c0b7227c0d"}, {"title": "How to Use AI at Work in 2026: From Everyday Prompts to Smarter Leadership", "url": "https://medium.com/@barronqasem/how-to-use-ai-at-work-in-2026-from-everyday-prompts-to-smarter-leadership-3f018d971c3e?source=rss------prompt_engineering-5", "why": "从日常提示词到更复杂协作的 AI 工作方法梳理，适合作为个人工作流的自查清单。", "id": "483d34855c166f96"}]}, "access": {"port": 8765, "local": "", "lan": [], "hostname": "", "public": "https://a3513419661-prog.github.io/ai-daily/", "cloud": true}}</script>
<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const FAV_KEY = 'ai-daily:favs';
const READ_KEY = 'ai-daily:read';
const favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]'));
const read = new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]'));
const catLabel = Object.fromEntries(DATA.categories.map(c => [c.key, c.label]));
let activeTab = 'all', keyword = '', favOnly = false, newOnly = false, zhOnly = false;

function save(){
  localStorage.setItem(FAV_KEY, JSON.stringify([...favs]));
  localStorage.setItem(READ_KEY, JSON.stringify([...read]));
}
function esc(s){ return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function isChinese(s){ return /[\u4e00-\u9fff]/.test(s || ''); }
function isReadable(item){ return Boolean(item.zh) || isChinese(item.title) || isChinese(item.summary); }
function relTime(iso){
  if(!iso) return '时间未知';
  const d = new Date(iso); if(isNaN(d)) return '时间未知';
  const h = (Date.now() - d.getTime()) / 36e5;
  if(h < 1) return '刚刚';
  if(h < 24) return Math.floor(h) + ' 小时前';
  if(h < 72) return Math.floor(h / 24) + ' 天前';
  return d.toLocaleDateString('zh-CN', {month:'2-digit', day:'2-digit'});
}

document.getElementById('dateLabel').textContent = DATA.date + ' · 更新于 ' + DATA.generated_at;
if(DATA.access){
  const a = DATA.access;
  const lines = [];
  if(a.public) lines.push(`<b>${a.cloud ? '本站地址（任何设备、任何网络都能打开）' : '公网地址（换网络也能开，比如在家）'}</b><span class="u">${a.public}</span>`);
  if(a.local) lines.push(`<b>本机打开</b><span class="u">${a.local}</span>`);
  if(a.lan && a.lan.length) lines.push(`<b>同一局域网的其他电脑 / 手机</b><span class="u">${a.lan.join('&nbsp;&nbsp;')}</span>`);
  if(a.hostname) lines.push(`<b>用主机名访问</b><span class="u">${a.hostname}</span>`);
  const hint = a.cloud
    ? '本页由 GitHub 云端每天 09:00 自动抓取并发布，不依赖任何一台个人电脑，公司电脑关机也能看。'
    : `以上链接都要求这台电脑开机、看板服务和隧道在运行（登录后自动启动）。
       公网地址由 Cloudflare 快速隧道提供，隧道重启（例如电脑重启）后地址会变，以这里显示的最新地址为准。`;
  document.getElementById('accessBox').innerHTML =
    lines.join('') + `<div class="hint">${hint}</div>`;
}
document.getElementById('stats').innerHTML = [
  ['今日新增', DATA.stats.new],
  ['累计条目', DATA.stats.total],
  ['近 30 小时', DATA.recent_count],
  ['订阅源', DATA.stats.sources_total],
  ['Skill', DATA.skills.length],
].map(([k,v]) => `<span class="chip">${k} <b>${v}</b></span>`).join('');

const dg = DATA.digest;
if(dg){
  const picks = (dg.picks || []).map(p => {
    const id = p.id || p.url || p.title;
    return `<li><a href="${p.url}" target="_blank" rel="noreferrer" data-open="${esc(id)}">${esc(p.title)}</a>` +
      (p.why ? ` <span class="why">— ${esc(p.why)}</span>` : '') + `</li>`;
  }).join('');
  const body = (dg.summary || '').split(/\n{1,}/).map(l => l.trim()).filter(Boolean)
    .map(l => l.startsWith('- ') ? `<p>• ${esc(l.slice(2))}</p>` : `<p>${esc(l)}</p>`).join('');
  document.getElementById('digest').innerHTML =
    `<h2>今日精选 <small class="meta">${esc(dg.date || DATA.date)}${dg.auto ? ' · 脚本自动排序' : ' · AI 生成'}</small></h2>` +
    body + (picks ? `<ol>${picks}</ol>` : '');
} else {
  document.getElementById('digest').style.display = 'none';
}
if(dg && dg.stale){
  const b = document.getElementById('staleBanner');
  b.style.display = 'block';
  b.textContent = '当前精选摘要不是今天的（' + dg.date + '），下面是历史摘要，等下一次自动更新即可。';
}

const tabs = [{key:'all', label:'全部'}].concat(DATA.categories);
document.getElementById('tabs').innerHTML = tabs.map(t => {
  const n = t.key === 'all'
    ? Object.values(DATA.items).flat().length
    : (DATA.items[t.key] || []).length;
  return `<div class="tab" data-tab="${t.key}">${t.label}<span class="n">${n}</span></div>`;
}).join('');

function allItems(){
  return Object.entries(DATA.items).flatMap(([cat, list]) => (list || []).map(i => ({...i, cat})));
}
function renderItems(){
  const pool = activeTab === 'all' ? allItems() : (DATA.items[activeTab] || []).map(i => ({...i, cat:activeTab}));
  const kw = keyword.trim().toLowerCase();
  const list = pool.filter(i => {
    if(favOnly && !favs.has(i.id)) return false;
    if(newOnly && !i.is_new) return false;
    if(zhOnly && !isReadable(i)) return false;
    if(!kw) return true;
    return ((i.title || '') + ' ' + (i.summary || '') + ' ' + (i.source || '') + ' ' + (i.tags || []).join(' '))
      .toLowerCase().includes(kw);
  }).sort((a,b) => (b.score || 0) - (a.score || 0));

  const grid = document.getElementById('grid');
  if(!list.length){ grid.innerHTML = '<div class="empty">没有匹配的条目</div>'; return; }
  grid.innerHTML = list.map(i => {
    const tags = (i.tags || []).slice(0,4).map(t => `<span class="tag">#${esc(t)}</span>`).join(' ');
    return `<article class="card ${read.has(i.id) ? 'read' : ''}" data-id="${i.id}">
      <span class="cat">${catLabel[i.cat] || ''}</span>
      <a class="tit" href="${i.url}" target="_blank" rel="noreferrer" data-open="${esc(i.id)}">${esc(i.title)}</a>
      ${i.zh ? `<div class="zh"><b>中文导读</b>${esc(i.zh)}</div>` : ''}
      ${i.summary ? `<div class="sum">${esc(i.summary)}</div>` : ''}
      <div class="row">
        <span class="badge src">${esc(i.source || '')}</span>
        ${i.kind === 'video' ? '<span class="badge video">▶ 视频</span>' : ''}
        <span>${relTime(i.published || i.first_seen)}</span>
        ${i.is_new ? '<span class="badge new">NEW</span>' : ''}
        ${i.extra ? `<span>${esc(i.extra)}</span>` : ''}
      </div>
      ${tags ? `<div class="row">${tags}</div>` : ''}
      <span class="star ${favs.has(i.id) ? 'on' : ''}" data-fav="${i.id}" title="收藏">★</span>
    </article>`;
  }).join('');
}

document.getElementById('skills').innerHTML = DATA.skills.map(s => `
  <div class="skill">
    <div class="sn">
      <span>${esc(s.name)}</span>
      <button class="copy" data-copy="$${esc(s.name)}">复制调用</button>
      <span class="badge src">${esc(s.origin || '')}</span>
    </div>
    <div class="sd">${esc(s.description || '（无描述）')}</div>
    <div class="row"><a href="${s.url}" class="tag">查看 SKILL.md</a></div>
  </div>`).join('');
document.getElementById('skillCount').textContent = `共 ${DATA.skills.length} 个（个人 + 插件内置）`;
if(!DATA.skills.length){
  document.getElementById('skills').closest('h2').style.display = 'none';
  document.getElementById('skills').style.display = 'none';
}

document.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if(tab){
    activeTab = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === tab));
    renderItems(); return;
  }
  const star = e.target.closest('[data-fav]');
  if(star){
    e.preventDefault();
    const id = star.dataset.fav;
    favs.has(id) ? favs.delete(id) : favs.add(id);
    save(); renderItems(); return;
  }
  const copy = e.target.closest('[data-copy]');
  if(copy){
    navigator.clipboard.writeText(copy.dataset.copy).then(() => {
      const old = copy.textContent; copy.textContent = '已复制';
      setTimeout(() => copy.textContent = old, 1200);
    }).catch(() => {});
    return;
  }
  const opener = e.target.closest('[data-open]');
  if(opener){
    const id = opener.dataset.open;
    read.add(id); save();
    const card = opener.closest('.card');
    if(card) card.classList.add('read');
  }
});

document.getElementById('search').addEventListener('input', e => { keyword = e.target.value; renderItems(); });
document.getElementById('favOnly').addEventListener('click', e => {
  favOnly = !favOnly; e.target.classList.toggle('on', favOnly); renderItems();
});
document.getElementById('zhOnly').addEventListener('click', e => {
  zhOnly = !zhOnly; e.target.classList.toggle('on', zhOnly); renderItems();
});
document.getElementById('newOnly').addEventListener('click', e => {
  newOnly = !newOnly; e.target.classList.toggle('on', newOnly); renderItems();
});

document.querySelector('.tab[data-tab="all"]').classList.add('on');
renderItems();
</script>
</body>
</html>
